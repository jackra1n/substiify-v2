name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: substiify_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: substiify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U substiify_test -d substiify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://substiify_test:test_password@localhost:5432/substiify_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv run --locked python -m unittest discover -s tests -v
